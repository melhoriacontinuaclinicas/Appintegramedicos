<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Integra + Médicos</title>
    <script type="text/javascript">
      // Redireciona qualquer rota 404 do GitHub Pages de volta para o index.html mantendo o caminho
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/' + l.pathname.split('/')[1] + '/' +
        '?p=/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
